    experiment: '大多数人选"今天拿100"，但选"31天后拿110"。时间远的时候，我们很理性；时间近的时候，我们立刻被当下的欲望俘虏。',

  {
    id: 17,
    text: '你去医院做体检，医生说："你的某个指标有点高，可能有问题，需要复查。"你的第一反应是什么？是冷静地想"概率多大"，还是立刻开始害怕？',
    concept: '概率忽视 / 情感启发',
    explanation: '当一件事带情感色彩的时候，我们就忽略了概率。哪怕得病的概率只有1%，"得病"这个画面本身就让我们害怕——系统1是用"画面有多生动"来判断风险的，不是用数字。',

const container = document.getElementById('questions-container');
const doneCount = document.getElementById('done-count');
const progressFill = document.getElementById('progress-fill');

let answered = new Set();

questions.forEach(q => {
  const card = document.createElement('div');
  card.className = 'question-card';
  card.dataset.id = q.id;
  card.innerHTML = `
    <span class="q-number">问题 ${q.id} / 20</span>
    <div class="q-text">${q.text}</div>
    <div class="q-hint">点击展开 → 看看这个问题背后的心理学原理</div>
    <div class="reveal">
      <div class="reveal-content">
        <span class="concept-tag">📌 ${q.concept}</span>
        <p>${q.explanation}</p>
        <div class="experiment">🔬 <strong>书中的实验：</strong>${q.experiment}</div>
        <div class="reflection">🤔 <strong>反思一下：</strong>${q.reflection}</div>
        <div class="self-check">
          <button onclick="markAnswered(${q.id}, this)">✓ 我想过这个问题了</button>
        </div>
      </div>
    </div>
  `;

  card.addEventListener('click', (e) => {
    if (e.target.tagName === 'BUTTON') return;
    card.classList.toggle('expanded');
  });

  container.appendChild(card);
});

function markAnswered(id, btn) {
  if (answered.has(id)) {
    answered.delete(id);
    btn.classList.remove('active');
    btn.textContent = '✓ 我想过这个问题了';
    btn.closest('.question-card').classList.remove('answered');
  } else {
    answered.add(id);
    btn.classList.add('active');
    btn.textContent = '✓ 已标记';
    btn.closest('.question-card').classList.add('answered');
  }
  doneCount.textContent = answered.size;
  progressFill.style.width = (answered.size / 20 * 100) + '%';
}
</script>
